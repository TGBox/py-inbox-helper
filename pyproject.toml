[project]
name = "py-inbox-helper"
version = "1.2.2"
description = "A python GUI application to help manage a chaotic and neglected email inbox of a busy person."
readme = "README.md"
authors = [
    { name = "Daniel Rösch", email = "droesch91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
    "pywin32>=312; sys_platform == 'win32'",
    "requests>=2.34.2",
    "keyring>=24.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
py-inbox-helper = "py_inbox_helper:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
